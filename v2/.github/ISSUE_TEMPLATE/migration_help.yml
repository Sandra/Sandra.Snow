name: Migration Help
description: Get help migrating from Sandra.Snow v1 to v2
title: "[Migration]: "
labels: ["migration", "help wanted"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Need help migrating from Sandra.Snow v1? We're here to help! Please provide details about your migration challenge.

  - type: checkboxes
    id: migration-checklist
    attributes:
      label: Migration Steps Completed
      description: Which migration steps have you completed?
      options:
        - label: Installed Sandra.Snow v2 CLI (`dotnet tool install --global Sandra.Snow.Cli`)
        - label: Ran migration tool (`sandra migrate ./my-site`)
        - label: Reviewed migration warnings and errors
        - label: Attempted to build with v2 (`sandra build`)

  - type: dropdown
    id: site-type
    attributes:
      label: Site Type
      description: What type of site are you migrating?
      options:
        - Personal Blog
        - Corporate/Business Site
        - Documentation Site
        - Portfolio Site
        - Other (please specify)
    validations:
      required: true

  - type: textarea
    id: v1-setup
    attributes:
      label: v1 Site Configuration
      description: Describe your current v1 setup
      placeholder: |
        - Number of posts/pages
        - Custom themes or layouts used
        - Any custom OWIN/Nancy extensions
        - Special configuration requirements
    validations:
      required: true

  - type: textarea
    id: migration-error
    attributes:
      label: Migration Issue
      description: What specific problem are you encountering?
      placeholder: |
        - Migration tool errors
        - Build failures after migration
        - Template conversion issues
        - Performance concerns
    validations:
      required: true

  - type: textarea
    id: migration-output
    attributes:
      label: Migration Tool Output
      description: If you ran the migration tool, paste the output here
      render: shell

  - type: textarea
    id: build-output
    attributes:
      label: Build Output
      description: If you attempted to build, paste the output here (use --verbose for more details)
      render: shell

  - type: textarea
    id: config-files
    attributes:
      label: Configuration Files
      description: Share your v1 and v2 configuration files (remove sensitive data)
      render: json

  - type: checkboxes
    id: custom-features
    attributes:
      label: Custom Features
      description: Check any custom features your v1 site uses
      options:
        - label: Custom Nancy modules or middleware
        - label: Custom Razor helpers or extensions
        - label: OWIN authentication or security
        - label: Custom file processing or filters
        - label: Integration with external systems
        - label: Custom deployment or build processes

  - type: textarea
    id: timeline
    attributes:
      label: Timeline
      description: When do you need to complete the migration?
      placeholder: Is this urgent or can we work through it step by step?

  - type: textarea
    id: help-offered
    attributes:
      label: How We Can Help
      description: What kind of assistance would be most helpful?
      placeholder: |
        - Step-by-step migration guidance
        - Template conversion assistance  
        - Configuration help
        - Performance optimization
        - Custom feature alternatives

  - type: checkboxes
    id: sharing
    attributes:
      label: Sharing Permission
      description: Can we use your case study to help other users?
      options:
        - label: You may use my migration experience (anonymized) to help other users
        - label: I'm willing to share my site configuration as an example
        - label: I can provide feedback on the migration process
